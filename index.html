<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URGENT - MISSING</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #4a90e2;
            border-radius: 50%;
            animation: float 15s infinite;
            opacity: 0.6;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
        }

        .urgent-header {
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 900;
            letter-spacing: 0.2em;
            color: #4a90e2;
            text-shadow: 
                0 0 10px rgba(74, 144, 226, 0.8),
                0 0 20px rgba(74, 144, 226, 0.6),
                0 0 30px rgba(74, 144, 226, 0.4);
            animation: pulse 2s ease-in-out infinite;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.02);
            }
        }

        .missing-banner {
            font-size: clamp(1.5rem, 5vw, 3rem);
            color: #6ba3f0;
            letter-spacing: 0.15em;
            margin-bottom: 3rem;
            animation: blink 1.5s step-end infinite;
            text-transform: uppercase;
            font-weight: 700;
        }

        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }
            51%, 100% {
                opacity: 0.3;
            }
        }

        .info-box {
            background: rgba(74, 144, 226, 0.1);
            border: 2px solid #4a90e2;
            border-radius: 8px;
            padding: 2rem;
            margin: 2rem 0;
            backdrop-filter: blur(10px);
            box-shadow: 
                0 0 20px rgba(74, 144, 226, 0.3),
                inset 0 0 20px rgba(74, 144, 226, 0.1);
            animation: borderPulse 3s ease-in-out infinite;
        }

        @keyframes borderPulse {
            0%, 100% {
                border-color: #4a90e2;
                box-shadow: 
                    0 0 20px rgba(74, 144, 226, 0.3),
                    inset 0 0 20px rgba(74, 144, 226, 0.1);
            }
            50% {
                border-color: #6ba3f0;
                box-shadow: 
                    0 0 30px rgba(107, 163, 240, 0.5),
                    inset 0 0 20px rgba(107, 163, 240, 0.2);
            }
        }

        .status-text {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: #8fb5f5;
            margin: 1.5rem 0;
            line-height: 1.6;
        }

        .timestamp {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #6ba3f0;
            opacity: 0.8;
            margin-top: 2rem;
            font-style: italic;
        }

        .alert-indicator {
            display: inline-block;
            width: 15px;
            height: 15px;
            background: #ff4444;
            border-radius: 50%;
            margin-right: 10px;
            animation: alertPulse 1s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.8);
        }

        @keyframes alertPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.7;
            }
        }

        .scrolling-text {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(74, 144, 226, 0.2);
            padding: 1rem;
            overflow: hidden;
            white-space: nowrap;
            border-top: 1px solid #4a90e2;
        }

        .scroll-content {
            display: inline-block;
            color: #6ba3f0;
            font-size: 1rem;
            animation: scroll 20s linear infinite;
        }

        @keyframes scroll {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <h1 class="urgent-header">URGENT</h1>
        <h2 class="missing-banner">MISSING</h2>
        
        <div class="info-box">
            <div class="status-text">
                <span class="alert-indicator"></span>
                STATUS: ACTIVE SEARCH
            </div>
            <div class="status-text">
                Last seen: Unknown
            </div>
            <div class="status-text">
                Priority: HIGH
            </div>
        </div>

        <div class="timestamp" id="timestamp"></div>
    </div>

    <div class="scrolling-text">
        <div class="scroll-content">
            ⚠️ URGENT ALERT • MISSING • REPORT IMMEDIATELY • ⚠️ URGENT ALERT • MISSING • REPORT IMMEDIATELY • ⚠️ URGENT ALERT • MISSING • REPORT IMMEDIATELY • 
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Update timestamp
        function updateTimestamp() {
            const now = new Date();
            const timestamp = document.getElementById('timestamp');
            const timeString = now.toLocaleString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
            timestamp.textContent = `Last updated: ${timeString}`;
        }

        // Initialize
        createParticles();
        updateTimestamp();
        setInterval(updateTimestamp, 1000);
    </script>
</body>
</html>
